[pytest]
testpaths = tests
# Adiciona a raiz do projeto ao sys.path durante a coleta/execução.
# Sem isso, o comando `pytest` (console script, como no GitHub Actions) não
# encontra server.py/database.py, pois o cwd não é inserido automaticamente.
pythonpath = .
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince20
